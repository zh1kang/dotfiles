set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'nhdaly/tmux-better-mouse-mode'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'egel/tmux-gruvbox'
set -g @tmux-gruvbox 'dark'

set -g @scroll-without-changing-pane "on"
set -g @emulate-scroll-for-no-mouse-alternate-buffer "on"

unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

set-option -g mouse on
set -g default-terminal "tmux-256color"
set-option -ga terminal-overrides ",xterm-256color:Tc"
set-option -ga terminal-overrides ",xterm-ghostty:Tc"
set -ga terminal-features ",xterm-ghostty:RGB"
set -g allow-passthrough all

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

bind c new-window -c "#{pane_current_path}"
set-option -g allow-rename off
set -g repeat-time 600
set -s escape-time 0
set -g default-shell /bin/zsh

setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind P paste-buffer

bind -n C-h select-pane -L
bind -n C-l select-pane -R
bind -n C-k select-pane -U
bind -n C-j select-pane -D

set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Theme
set -g status on
set -g status-style "bg=#1d2021,fg=#ebdbb2"
set -g status-left-style "bg=#98971a,fg=#1d2021,bold"
set -g status-right-style "bg=#282828,fg=#ebdbb2"
set -g window-status-style "bg=#1d2021,fg=#928374"
set -g window-status-current-style "bg=#98971a,fg=#1d2021,bold"
set -g window-status-activity-style "bg=#282828,fg=#fabd2f"
set -g pane-border-style "fg=#3c3836"
set -g pane-active-border-style "fg=#98971a"
set -g message-style "bg=#98971a,fg=#1d2021,bold"
set -g mode-style "bg=#98971a,fg=#1d2021,bold"
set -g clock-mode-colour "#98971a"
set -g display-panes-colour "#928374"
set -g display-panes-active-colour "#98971a"

if-shell '[ -x "$HOME/.tmux/plugins/tpm/tpm" ]' 'run-shell "$HOME/.tmux/plugins/tpm/tpm"'
